# Application
spring.application.name=spring357-eshop
server.port=${APP_SERVER_PORT}
springdoc.api-docs.path=/api-docs

# Admin user
app.admin.firstname=${ADMIN_FIRST_NAME}
app.admin.lastname=${ADMIN_LAST_NAME}
app.admin.username=${ADMIN_USER_NAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL}

# PostgreSQL DataSource
spring.datasource.url=${POSTGRES_SERVER_URL}
spring.datasource.username=${POSTGRES_USER_NAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO