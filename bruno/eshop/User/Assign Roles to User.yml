info:
  name: Assign Roles to User
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/api/users/2/roles"
  body:
    type: json
    data: |-
      {
        "roles": [
          "ROLE_CUSTOMER"
        ],
        "operationType": "ADD"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
