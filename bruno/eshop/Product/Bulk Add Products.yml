info:
  name: Bulk Add Products
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/products/bulk"
  body:
    type: json
    data: |-
      [
        {
          "name": "Bulk Item One",
          "description": "First bulk item",
          "price": 9.99,
          "category": "Accessories",
          "stockQuantity": 15,
          "sku": "SKU-BULK-1"
        },
        {
          "name": "Bulk Item Two",
          "description": "Second bulk item",
          "price": 14.99,
          "category": "Accessories",
          "stockQuantity": 8,
          "sku": "SKU-BULK-2"
        }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
