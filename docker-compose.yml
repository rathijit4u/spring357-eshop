services:

  postgres:
    image: postgres:16-alpine
    container_name: eshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eshop-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: eshop-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 192m

  redis-insight:
    image: redis/redisinsight:latest
    container_name: eshop-redis-insight
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 384m

  # Spring Boot Application Service
  app:
    build: .
    container_name: eshop-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      APP_SERVER_PORT: 8080
      ADMIN_FIRST_NAME: Admin
      ADMIN_LAST_NAME: User
      ADMIN_USER_NAME: ${ADMIN_USER_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      POSTGRES_SERVER_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER_NAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PROJECT_NAME: rathijit4u:spring357-eshop
      REDIS_API_TEST_DIR: API_TEST
      REDIS_USER_DIR: USER_PROFILE
      REDIS_ERROR_DIR: UNKNOWN_ERROR
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g


volumes:
  postgres-data:
  redis-data:
  redisinsight-data:
  